  operator: guard_removal
  mutation: "`when is_binary(outer)` → `(no guard)`"
  sort: equivalent
  reason: "The module stack only ever holds strings produced by module_name/2, so the is_binary(outer) guard is always true."
- at: lib/covenant/mutate/mutator.ex:161:53
  operator: return_nil
  mutation: "`inspect(atom)` → `nil`"
  sort: dead-code
  reason: "With the literal encoder an atom module name is block-wrapped, so a bare atom never reaches this clause."
- at: lib/covenant/mutate/mutator.ex:172:33
  operator: guard_removal
  mutation: "`when is_atom(name)` → `(no guard)`"
  sort: equivalent
  reason: "A head without arguments (`def name`) has an atom name; a non-atom name comes with an argument list and is handled by the clause above."
- at: lib/covenant/mutate/mutator.ex:175:31
  operator: guard_removal
  mutation: "`when is_list(meta)` → `(no guard)`"
  sort: equivalent
  reason: "Anchors are AST nodes whose meta is a list, so the is_list(meta) guard is always true."
- at: lib/covenant/mutate/mutator.ex:176:25
  operator: return_nil
  mutation: "`{nil, nil}` → `nil`"
  sort: dead-code
  reason: "Every anchor is an AST node with list meta, so the {nil, nil} fallback of position/1 is never used."
- at: lib/covenant/mutate/mutator.ex:184:9
  operator: condition_negate
  mutation: "`if n == index` → `if !(n == index)`"
  sort: timeout
  reason: "Negating `n == index` makes apply/2 replace every other node with the replacement, which contains nodes that are then rewritten again; the walk never ends and the tests only time out."
- at: lib/covenant/mutate/mutator.ex:184:14
  operator: comparison_swap
  mutation: "`==` → `!=`"
  sort: timeout
  reason: "`n != index` makes apply/2 replace every node but one with the replacement, which the walk then rewrites again forever; the tests only time out."
- at: lib/covenant/mutate/mutator.ex:213:10
  operator: statement_removal
  mutation: "`Code.put_compiler_option(:ignore_module_conflict, true)` → `(removed)`"
  sort: log-only
  reason: "Without :ignore_module_conflict the compiler only warns \"redefining module\"; compile/2 collects diagnostics with Code.with_diagnostics/1 and drops them."
- at: lib/covenant/mutate/mutator.ex:213:55
  operator: boolean_flip
  mutation: "`true` → `false`"
  sort: log-only
  reason: "Setting :ignore_module_conflict to false only makes the compiler warn \"redefining module\", which compile/2 collects and drops."
- at: lib/covenant/mutate/mutator.ex:244:32
  operator: guard_removal
  mutation: "`when is_integer(line)` → `(no guard)`"
  sort: evaluation-gap
  reason: "Needs a compile error whose diagnostic position is neither {line, column} nor an integer line; no source tried produces one, so the catch-all clause's guard is not pinned."
- at: lib/covenant/mutate/mutator.ex:245:34
  operator: return_nil
