- at: lib/covenant/mutate/operators.ex:95:5
  operator: element_removal
  mutation: "`:->` → `(removed)`"
  sort: equivalent
  reason: "A `->` clause is an element of the clause list of a case, cond, fn or receive, never a statement of a block, so excluding it from statement removal changes nothing."
