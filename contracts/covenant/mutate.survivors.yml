  mutation: "`and` → `or`"
  sort: equivalent
  reason: "`is_list(exprs) or length(exprs) > 1` is true for every block; a block of a single expression has no non-final statement (`i < last` with last = 0), so the result is unchanged."
- at: lib/covenant/mutate/operators.ex:203:91
