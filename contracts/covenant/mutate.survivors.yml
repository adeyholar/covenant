# Survivor sort for covenant.mutate (`mix covenant.mutate covenant.mutate --test-path test/contract/covenant/mutate/mutate_contract_test.exs`).
# The Runner, Workdir and Mix task are not in `modules:` (the worker executes them while it swaps mutants), so none of their mutants exist here.
# Every entry below was read against the code: a guard the AST shape always satisfies, a catch-all no valid source reaches, a falsy nil for false, or a
# position that only reaches diagnostics. Sorts: equivalent | log-only | dead-code | timeout | evaluation-gap | decision-hole.
- at: lib/covenant/mutate.ex:253:5
  operator: element_removal
  mutation: "`\"invalid\" => :invalid` → `(removed)`"
  sort: equivalent
  reason: "decode_raw falls back to :invalid for any unknown outcome name (`Map.get(@outcomes, name, :invalid)`), so the explicit \"invalid\" entry is redundant."
- at: lib/covenant/mutate.ex:253:5
  operator: string_empty
  mutation: "`\"invalid\"` → `\"\"`"
  sort: equivalent
  reason: "The key \"\" is never written; an unknown outcome name decodes to :invalid by the Map.get default, which is what \"invalid\" decodes to."
- at: lib/covenant/mutate/matrix.ex:387:88
  operator: integer_shift
  mutation: "`10` → `9`"
  sort: equivalent
  reason: "The default width of an empty obligation table is raised to at least 10 by `max(width, 10)` on the next line, so 9 or 10 gives the same header."
- at: lib/covenant/mutate/modules.ex:77:24
  operator: string_empty
  mutation: "`\"\\n\"` → `\"\"`"
  sort: equivalent
  reason: "Code spans are delimited by backticks and never cross a line, so joining the Public surface and the scopes with \"\" instead of \"\\n\" tokenises to the same spans."
- at: lib/covenant/mutate/modules.ex:79:27
  operator: string_empty
  mutation: "`\"\\n\"` → `\"\"`"
  sort: equivalent
  reason: "Scopes are joined into one text that is scanned for backtick-delimited code spans; \"\\n\" or \"\" between two scopes yields the same spans."
- at: lib/covenant/mutate/modules.ex:175:13
  operator: clause_removal
  mutation: "`case _ ->` → `(removed)`"
  sort: evaluation-gap
  reason: "A loaded module whose compile info has no :source (built from forms without a source option) is needed to reach this branch; Elixir-compiled modules always record one and names are resolved under Elixir., so no test module can be built for it."
- at: lib/covenant/mutate/modules.ex:161:18
  operator: guard_removal
  mutation: "`when is_list(source)` → `(no guard)`"
  sort: evaluation-gap
  reason: "Same branch as m0500: only a module with a non-list :source reaches the guard's other side."
- at: lib/covenant/mutate/modules.ex:176:21
  operator: string_empty
  mutation: "`\"has no source file\"` → `\"\"`"
  sort: evaluation-gap
  reason: "Same branch as m0500: the \"has no source file\" reason needs a module compiled without source information."
- at: lib/covenant/mutate/mutator.ex:140:22
  operator: return_nil
  mutation: "`false` → `nil`"
  sort: equivalent
  reason: "The result only feeds a boolean test (`if`, `and`, `Enum.filter/2`), where nil and false behave alike."
- at: lib/covenant/mutate/mutator.ex:143:40
  operator: return_nil
  mutation: "`false` → `nil`"
  sort: equivalent
  reason: "The result only feeds a boolean test (`if`, `and`, `Enum.filter/2`), where nil and false behave alike."
