- id: exceptions-need-no-test
  date: "2026-10-09"
  decision: "A `kind: exception` block is a declaration about code, not a promise; it needs no tagged test and is excluded from coverage denominators, as are retired obligations."
  driver: The convention says an exception "fails the build when its target no longer exists" and nothing about tests; a test for "we intentionally duplicate this" asserts nothing.
  alternatives:
    - option: Count exceptions as obligations needing a test
      rejected: Every exception would get a vacuous test written to satisfy the tool, which the convention forbids ("a contract example is never deleted to satisfy a tool" cuts both ways).
    - option: Count exceptions in the denominator but never as covered
      rejected: Coverage could never reach 100% for a component with a declared exception, which hides real gaps.
  evidence: docs/contract-convention.md, "Light form" section.
  invariant: covenant.check.I1
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: "The convention keeps `kind: exception` as a block kind rather than a separate section"
  expires: If exceptions move out of obligation blocks
  source: ["docs/contract-convention.md"]

- id: untagged-test-is-compile-error
  date: "2026-10-09"
  decision: A test inside a `Covenant.Case` module without an `obligation` tag is a compile error, not a warning.
  driver: The convention tags every contract test; an untagged test in `test/contract/` is an implementation test in the wrong place and contributes nothing to coverage.
  alternatives:
    - option: Warn and skip untagged tests
      rejected: Warnings scroll past; the test still runs and looks like a contract test to a reader.
    - option: Count untagged tests as coverage for nothing
      rejected: Same as warning, with a misleading results file.
  evidence: docs/contract-convention.md, "Contract tests" section.
  invariant: covenant.case.I2
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: Contract tests live in their own directory, so implementation tests have somewhere else to go
  expires: Never
  source: ["docs/contract-convention.md"]

- id: same-component-tags
  date: "2026-10-09"
  decision: A test may only be tagged with obligations of the component its module declares; tagging another component's obligation is a compile error.
  driver: "`mix covenant.regen` collects a component's contract tests by the module's `component:` declaration; a test tagged across components would be left out of the pack it proves."
  alternatives:
    - option: Allow any obligation id and let coverage sort it out
      rejected: Regeneration packs would be silently incomplete.
  evidence: Covenant.Regen.find_tests/3 reads the `use Covenant.Case, component:` line.
  invariant: covenant.case.I1
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: Regeneration packs are assembled per component
  expires: If packs are assembled per obligation instead
  source: ["lib/covenant/regen.ex"]

- id: results-per-app
  date: "2026-10-09"
  decision: Covenant.Formatter writes one results file per Mix app (`<results_dir>/<app>.json`) under a `_build/covenant/results` directory shared by every MIX_ENV; `mix covenant.check` merges them.
  driver: In an umbrella each app runs its own suite; one results file would be overwritten by each app's suite, and `_build/test` is not where the check task (running in dev) looks.
  alternatives:
    - option: One results file, merged by module on write
      rejected: Entries for deleted modules linger forever.
    - option: Results under `_build/<env>`
      rejected: The check task runs in dev and the suite in test; they would never see the same directory.
  evidence: Mix.Project.build_path/0 is `_build/<env>`; its dirname is stable across envs.
  invariant: covenant.results.I2
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: Elixir ships the JSON module used to write results
      check: { kind: elixir, version: ">= 1.18.0" }
  expires: If Covenant grows its own results store
  source: ["lib/covenant/formatter.ex", "lib/covenant.ex"]

- id: targets-are-public-code
  date: "2026-10-09"
  decision: An exception `target` names a public function (`Module.fun/arity`), a module, or a file path; private functions cannot be targeted.
  driver: Staleness is checked with `function_exported?/3`, which only sees public functions; parsing source to find private ones is not worth its weight for a first version.
  alternatives:
    - option: Parse the module's source with Code.string_to_quoted to find private functions
      rejected: Needs a source-path mapping per module; deferred until a real exception needs it.
  evidence: Covenant.Target.exists?/2.
  invariant: covenant.check.I4
  approved_by: Covenant's author (initial build, 2026-10-09)
  kind: known-gap
  conditions:
    - text: No exception in a Contract Covenant checks targets a private function yet
  expires: When the first private-function exception is declared
  source: ["lib/covenant/target.ex"]

- id: suite-runs-as-subprocess
  date: "2026-10-09"
  decision: "`mix covenant.check` runs the contract suite as a `mix test` subprocess with `MIX_ENV=test`, never in-process."
  driver: Running ExUnit inside another Mix task would share the task's env and build, and a failing suite would take the task down with it.
  alternatives:
    - option: Mix.Task.run("test") in-process
      rejected: Env switching and ExUnit lifecycle inside a running task are fragile; the test build would also pollute the dev build.
  evidence: Elixir's own `mix test` switches env through the CLI, not through Mix.Task.run.
  invariant: covenant.tasks.I1
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: The `mix` executable is found through PATH
      check: { kind: env, name: PATH }
  expires: Never
  source: ["lib/mix/tasks/covenant.check.ex"]

- id: yaml-via-yaml-elixir
  date: "2026-10-09"
  decision: Decision records and scope ceilings are YAML read through yaml_elixir, the only runtime dependency.
  driver: The convention fixes YAML for records; yaml_elixir wraps the mature Erlang yamerl parser and adds nothing else.
  alternatives:
    - option: Records as Elixir terms or JSON
      rejected: The convention is YAML, which keeps records readable by tools in other languages.
  evidence: docs/contract-convention.md, "Decision records" section.
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: yaml_elixir 2.12 or compatible is locked
      check: { kind: dep, name: yaml_elixir, version: "~> 2.12" }
  expires: If the convention moves records off YAML
  source: ["mix.exs"]

- id: references-checked-at-check-time
  date: "2026-10-09"
  decision: Dangling `record`, `invariant`, `superseded_by` and `depends_on` references fail `mix covenant.check`, not the compilation of contract tests.
  driver: A test module needs a parsable Contract to validate its tags; a dangling record reference does not make an obligation id ambiguous, so it must not stop the suite from compiling.
  alternatives:
    - option: Fail compilation on any Contract problem
      rejected: One stale record id would block every contract test from compiling.
  evidence: Covenant.Contract.load/1 (structural) versus Covenant.Contract.Validate.dangling/1 (references).
  invariant: covenant.check.I6
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: Structural errors still fail compilation through Covenant.Case
  expires: Never
  source: ["lib/covenant/contract/validate.ex", "lib/covenant/case.ex"]

- id: small-surface
  date: "2026-10-09"
  decision: Covenant stays under 30 source files in lib/.
  driver: Every unit of complexity pays rent in leverage; a contract tool that cannot be read in an afternoon will not be trusted to gate merges.
  alternatives:
    - option: No ceiling
      rejected: The first scope budget Covenant checks should be its own.
  evidence: 23 files at the initial build.
  approved_by: Covenant's author (initial build, 2026-10-09)
  conditions:
    - text: The source lives under lib/
      check: { kind: file, path: lib/covenant.ex }
  expires: When `mix covenant.mutate` lands and the ceiling is re-examined
  source: ["contracts/system/scope.yml"]
  superseded_by: small-surface-after-mutate

- id: small-surface-after-mutate
  date: "2026-10-10"
  decision: Covenant stays under 36 source files in lib/.
  driver: The `small-surface` ceiling expired when `mix covenant.mutate` landed (nine files, 32 in all); static mode adds one (`Covenant.Static`), 33. The ceiling is re-examined, not dropped, and keeps a little headroom.
  alternatives:
    - option: Keep 30 and fold the mutate modules together
      rejected: The mutate modules are each a separate concern (operators, runner, matrix, survivors); merging them only to meet a number makes them harder to read.
    - option: No ceiling
      rejected: The first scope budget Covenant checks should be its own.
  evidence: 33 files under lib/ after static mode (find lib -name '*.ex').
  approved_by: "lead, 2026-10-10; contract integrator (workflow pass, 2026-10-10)"
  conditions:
    - text: The source lives under lib/
      check: { kind: file, path: lib/covenant.ex }
  expires: When the next subsystem lands in Covenant
  source: ["contracts/system/scope.yml"]
  superseded_by: small-surface-after-sibling

- id: static-reads-literals
  date: "2026-10-10"
  decision: "`Covenant.Static` reads contract tests with `Code.string_to_quoted/2` and accepts only literal component names and literal obligation tags (a string or a list of strings); anything else is a problem at its line, never a guess and never an evaluation."
  driver: The first large Contract Covenant checked (35 test files, 1046 tests) was written before any implementation existed, so its tests could not compile; the tag rules still have to hold. Evaluating module attributes or variables would mean running test code.
  alternatives:
    - option: Compile the test files against generated stubs
      rejected: Needs every module the tests name; the stubs would be a second, unreviewed implementation.
    - option: Regex over the source
      rejected: Cannot tell `describe` scope, `@moduletag` inheritance or a commented-out tag from a real one.
  evidence: ExUnit tag merge order read from ExUnit.Case.register_test (moduletag, then describetag, then tag; the last value of a key wins).
  invariant: [covenant.static.I1, covenant.static.I3]
  approved_by: "lead, 2026-10-10; contract integrator (workflow pass, 2026-10-10)"
  conditions:
    - text: Elixir is at least 1.18 (Code.string_to_quoted/2 with emit_warnings)
      check: { kind: elixir, version: ">= 1.18.0" }
  expires: When contract tests may build tags at compile time
  source: ["lib/covenant/static.ex"]

- id: static-skips-compiled-checks
  date: "2026-10-10"
  decision: In static mode, exception targets naming a module or function and `module` ceiling counters are listed as skipped, not failed; file targets and `glob` counters are still checked against the root.
  driver: With no compiled code every module target looks stale and every module counter is uncountable; failing them would make the static check permanently red and train people to ignore it.
  alternatives:
    - option: Fail them as in a real run
      rejected: In that Contract, thirteen of fourteen ceilings and five exceptions would have failed before a line of implementation existed.
    - option: Drop them silently
      rejected: A reader would think they were checked.
  evidence: "That Contract's system/scope.yml (13 module counters, 1 glob) and its five `kind: exception` blocks at the first static run."
  invariant: covenant.check.I10
  approved_by: "lead, 2026-10-10; contract integrator (workflow pass, 2026-10-10)"
  expires: When the code under test exists wherever the check runs
  source: ["lib/covenant/check.ex"]

- id: static-coverage-own-file
  date: "2026-10-10"
  decision: 'Static coverage is written to `<contracts dir>/coverage.static.json`, marked `"mode": "static"`; `coverage.json` stays the record of a real, passing run.'
  driver: Coverage is defined as obligations with a passing test (covenant.check.I7); a tagged-but-never-run test must not overwrite that number.
  alternatives:
    - option: Overwrite coverage.json
      rejected: A static 100% would read as a passing 100%.
  evidence: covenant.check.I7 (coverage is passing obligations over active ones).
  invariant: covenant.tasks.I6
  approved_by: "lead, 2026-10-10; contract integrator (workflow pass, 2026-10-10)"
  expires: Never
  source: ["lib/mix/tasks/covenant.check.ex"]

- id: root-is-contracts-parent
  date: "2026-10-10"
  decision: "`Covenant.root/0` is the directory that holds the contracts directory: `COVENANT_ROOT`, then `config :covenant, root:`, then the parent of `contracts_dir` (absolute, or found from the working directory upwards), then the working directory."
  driver: Contract tests resolve paths from the project root (docs/contract-convention.md, "Contract tests"); in an umbrella `mix test` runs each app from `apps/<app>`, so the working directory is never the root.
  alternatives:
    - option: Walk up to the nearest directory with a .git or mix.exs
      rejected: A project can sit inside another repository, as Covenant itself began, with its own mix.exs and contracts/; the contracts directory is what the Contract means by root.
  evidence: docs/contract-convention.md, "Contract tests"; the umbrella fixture under test/fixtures/umbrella_project.
  invariant: covenant.static.I5
  approved_by: "lead, 2026-10-10; contract integrator (workflow pass, 2026-10-10)"
  expires: Never
  source: ["lib/covenant.ex"]

- id: test-paths-resolve-against-root
  date: "2026-10-10"
  decision: "The configured `test_paths` resolve against `Covenant.root/0` in every task and in `Covenant.test_paths/0`; a `--test-path` typed on the command line resolves against the working directory. `--contracts` redirects the Contract, not the root the configured paths resolve against."
  driver: "In an umbrella, `mix covenant.regen billing.invoices` run from `apps/billing` and `mix covenant.mutate core.tenancy` run from `apps/core` found no contract tests: `apps/*/test/contract` was expanded relative to the app directory."
  alternatives:
    - option: Resolve against the working directory, as before
      rejected: "A configured path is the project's, not the user's; in an umbrella the working directory is never the root (record root-is-contracts-parent)."
    - option: Resolve a typed `--test-path` against the root too
      rejected: "A user types a path relative to where they are; every shell tool works that way."
    - option: Let `--contracts DIR` move the root to DIR's parent
      rejected: "`mix covenant.check --contracts tmp/copy` documents another Contract for the same tests in the working directory; moving the root would stop finding them."
  evidence: record root-is-contracts-parent; covenant.tasks.I9.
  invariant: covenant.static.I6
  approved_by: "lead, 2026-10-10; lead's Covenant fixes brief (2026-10-10)"
  expires: Never
  source: ["lib/covenant.ex", "lib/mix/tasks/covenant.check.ex", "lib/mix/tasks/covenant.regen.ex", "lib/mix/tasks/covenant.mutate.ex"]

- id: declared-elsewhere-is-foreign
  date: "2026-10-10"
  decision: "A module another component lists (`#### Modules` paragraph or `modules:`) belongs to that component, ahead of every location rule, and a loadable module of the running project that no list claims is already implemented, not the component's to stub. A name that is neither loadable nor in a namespace the component uses is resolved as an alias of a known module or dropped."
  driver: "A pack for `billing.invoices` stubbed `MyApp.Repo.Scoped`, `MyApp.Tenancy`, `MyApp.Clock` and `MyApp.Test.*`: modules `core.tenancy` lists and the project already implements. Without a list every module of the running project counted as the component's."
  alternatives:
    - option: Keep treating every loadable module of the project as owned
      rejected: "That is the bug: the pack shadows other components' implemented modules."
    - option: Derive the owner from the modules other components name in their obligation scopes
      rejected: "Scopes name collaborators as well as the component's own code, so the owner would be a guess; a list is a declaration."
    - option: Stub what cannot be placed and report it, for every unplaced name
      rejected: "`Spend.Policy` (a fragment of `MyApp.LLM.Spend.Policy`) and `MyApp.Test.Log` were stubbed as if the component owned them. Only a loadable module whose beam lies nowhere known is still stubbed and reported."
  evidence: the `#### Modules` paragraph of that project's `core.tenancy` intent; covenant.regen.I8, I9.
  invariant: covenant.regen.I9
  approved_by: "lead, 2026-10-10; lead's Covenant fixes brief (2026-10-10)"
  conditions:
    - text: A component that wants its own implemented modules stubbed lists them
  expires: When a component can claim modules some other way than a list
  source: ["lib/covenant/regen/ownership.ex"]

- id: undeclared-modules-warn-only
  date: "2026-10-10"
  decision: "A component that declares no modules is a warning of `mix covenant.check`, never a failure; the whole-product `system` intent is exempt."
  driver: "`mix covenant.regen` and `mix covenant.mutate` can only guess what a component without a list owns; most of a young Contract declares none, and failing on all of them would block every check."
  alternatives:
    - option: Fail the check
      rejected: "A Contract written ahead of its implementation has nothing to list yet, and a failure nobody can act on is ignored."
  evidence: covenant.check.I11.
  invariant: covenant.check.I11
  approved_by: "lead, 2026-10-10; lead's Covenant fixes brief (2026-10-10)"
  expires: When every component declares its modules
  source: ["lib/covenant/check.ex"]

- id: small-surface-after-sibling
  date: "2026-10-10"
  decision: Covenant stays under 40 source files in lib/.
  driver: "The `small-surface-after-mutate` ceiling expired when the sibling layout landed: reading `contract/<primitive>/` adds a parser (`Covenant.Parser.Primitive`) and the covers references (`Covenant.Covers`), 37 files in all."
  alternatives:
    - option: Keep 36 and fold the sibling reader into Covenant.Parser.Markdown
      rejected: "The two layouts share no grammar: obligation blocks with fields against one-line `- **A1**` items, front matter against `covers` fences. One module would hold two parsers."
    - option: No ceiling
      rejected: The first scope budget Covenant checks should be its own.
  evidence: "37 files under lib/ after the sibling layout (find lib -name '*.ex')."
  approved_by: "lead, 2026-10-10"
  conditions:
    - text: The source lives under lib/
      check: { kind: file, path: lib/covenant.ex }
  expires: When the next subsystem lands in Covenant
  source: ["contracts/system/scope.yml"]
